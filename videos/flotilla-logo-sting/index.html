<!doctype html>
<!--
  flotilla-logo-sting — 3.6s / 1920x1080 / 30fps logo sting for Flotilla.

  Built reuse-first from the registry COMPONENT `titlecard-lockup`
  (compositions/components/titlecard-lockup.html). Components are snippets,
  not sub-compositions: its markup, CSS and tween schedule are MERGED into
  this host file and folded into this file's single host timeline. The
  component's own IIFE and its `window.__timelines["titlecard-lockup"]`
  registration are deliberately NOT copied, so exactly one timeline is
  registered for this composition. The component file stays on disk unused
  and is never referenced by `data-composition-src`, so it never mounts.

  Customizations vs the component (all from shot-plan.json `customize`):
    - `.tl-wordmark` text span -> the INLINED contents of
      assets/brand/flotilla-lockup.svg (outlined paths, self-contained, no
      font and no network). The brand forbids retypesetting the wordmark in
      a substitute display face. Its internal `title`/`desc` ids are
      namespaced to `fl-lockup-*`. Sized by width in cqw, height auto, so
      the 1060x260 aspect is preserved and uniform scale is the only
      transform ever applied to it.
    - `.tl-rule-svg line`: the component's color-mix(accent, fg) at
      stroke-opacity .62 muddies the brand teal -> flat var(--brand) at
      full opacity (shot-plan `rule_override`).
    - `.tl-label` ink: the component's color-mix(fg, bg) -> the brand's
      exact muted token var(--muted) (shot-plan `ink_override`).
    - kicker omitted (shot-plan `kicker: null`). The component hides an
      empty kicker and keeps its schedule unchanged, so omitting the node
      is visually and temporally identical.
    - `.tl-label` font-size 2.2cqmin -> 2.4cqmin (23.8px -> 25.9px). The
      mandated muted ink on paper is 3.49:1, which clears WCAG AA only
      under the large-text threshold, and `check` applies that at >=24px.
      Raising the size keeps the brand ink byte-exact instead of darkening
      it; `check` contrast then reports 3/3 passing.
    - exit = none, so the last tween lands at 1.80 and the frame is then
      dead still to 3.60.

  Determinism: no clock, no random, no network beyond the framework's own
  GSAP tag, no <img src>. All artwork is inline SVG.

  Every colour is declared once on #stage as a custom property; no hex
  appears in the markup.
-->

    <meta charset="UTF-8" />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper, #faf9f7);
      }

      /* Root composition element. Sized in CSS so the centred flex/grid
         children resolve a real height instead of collapsing. */
      #stage {
        --paper: #faf9f7;
        --bg: #faf9f7;
        --fg: #1a1917;
        --brand: #0f766e;
        --muted: #8a857c;
        --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        /* container basis for every cq* unit below */
        container-type: size;
        color: var(--fg);
        background: var(--bg);
      }

      .tl-clip {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--bg);
      }

      .tl-lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 92cqw;
        text-align: center;
      }

      /* The lockup art. One indivisible unit: the mark and the wordmark are
         a single <svg>, so the settle below can only ever move them
         together, and no boat can be revealed, moved or recoloured on its
         own. Width-driven in cqw with height:auto keeps the 1060x260
         aspect exactly -- never stretched, never skewed. */
      .tl-wordmark {
        display: block;
        width: 52cqw;
        height: auto;
        max-width: 92cqw;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      /* Artwork colours, declared once, identical to the brand tokens. The
         fill sits on the mark's parent <g>, so all three boats always carry
         one colour. */
      .fl-mark {
        fill: var(--brand);
      }

      .fl-word {
        fill: var(--fg);
      }

      /* Hairline rule. Spans the lockup's own width so it draws from the
         lockup's left edge (shot-plan `rule_behaviour`); the component's
         centred 34cqw rail would have started inboard of the mark. */
      .tl-rule-svg {
        display: block;
        width: 52cqw;
        height: max(1px, 0.2cqmin);
        margin-top: 4cqh;
      }

      .tl-rule-svg line {
        stroke: var(--brand);
        stroke-width: 2;
      }

      .tl-label {
        display: block;
        margin-top: 3.2cqh;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 2.4cqmin;
        font-weight: 600;
        line-height: 1.4;
        letter-spacing: 0.34em;
        /* balances the trailing tracking so the line optically centres */
        text-indent: 0.34em;
        text-transform: uppercase;
        will-change: transform, opacity;
      }
    </style>
  </head>

    <script>
      (function () {
        "use strict";

        var stage = document.getElementById("stage");
        var art = stage.querySelector(".tl-wordmark");
        var ruleLine = stage.querySelector(".tl-rule");
        var label = stage.querySelector(".tl-label");

        // Measured-length dash for the rule draw: getTotalLength, never the
        // pathLength attribute and never non-scaling-stroke on a dashed
        // path. Set before the tween so frame 0 shows an undrawn rule.
        var ruleLength = ruleLine.getTotalLength();
        ruleLine.style.strokeDasharray = String(ruleLength);
        ruleLine.style.strokeDashoffset = String(ruleLength);

        // THE single host timeline. The merged component contributes tweens
        // to this one timeline; it does not register its own.
        var tl = gsap.timeline({ paused: true });

        // 0.00-0.25  paper ground, empty. The component's beat of quiet,
        //            which an absent kicker leaves in place.

        // 0.25-1.10  THE one move: the lockup settles dead-centre,
        //            scale .96 -> 1 with autoAlpha, entrance half only.
        //            power3.out cannot overshoot, so it clamps at 1 and
        //            the held value is never passed.
        tl.fromTo(
          art,
          { autoAlpha: 0, scale: 0.96 },
          { autoAlpha: 1, scale: 1, duration: 0.85, ease: "power3.out" },
          0.25,
        );

        // 0.90-1.45  hairline rule draws left to right. The single pattern
        //            interrupt.
        tl.fromTo(
          ruleLine,
          { strokeDashoffset: ruleLength },
          { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
          0.9,
        );

        // 1.30-1.80  mono tagline fades up beneath the rule. The component
        //            authors this rise as 1.8cqh; on this fixed 1080px
        //            canvas that is 20px, written in px so GSAP resolves it
        //            identically on every host.
        tl.fromTo(
          label,
          { autoAlpha: 0, y: 20 },
          { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" },
          1.3,
        );

        // 1.80-3.60  true stillness. An empty tween on a throwaway proxy
        //            carries the hold so the timeline length matches
        //            data-duration; nothing on screen is touched. No
        //            drift, no breath, no pulse.
        tl.to({}, { duration: 1.8 }, 1.8);

        tl.seek(0);
        window.__timelines["flotilla-logo-sting"] = tl;
      })();
